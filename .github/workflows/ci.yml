name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Coverage
        run: npm run test:cov

      - name: Smoke test startup
        run: npm run smoke

      - name: Audit
        run: npm run audit

  # keep a minimal smoke job name for branch protection if needed
  smoke:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - run: echo "Quality gate passed"
